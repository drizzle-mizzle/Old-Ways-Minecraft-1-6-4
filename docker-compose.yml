services:
  minecraft:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: mc164-towny:1.0
    container_name: mc164
    restart: unless-stopped

    ports:
      - "25565:25565"

    volumes:
      # Всё состояние сервера: миры, города Towny, классы Heroes, права, банк.
      # Образ можно пересобирать и обновлять — том переживёт.
      - mcdata:/data

    environment:
      JAVA_XMS: "2G"
      JAVA_XMX: "4G"
      # Towny считает «новый день» по времени контейнера — ставьте свою зону
      TZ: "Europe/Moscow"

    # Ядру 1.6.4 нужно время на сохранение миров по SIGTERM.
    # Если docker убьёт его раньше, можно потерять последние чанки.
    stop_grace_period: 120s

    # Одного потока хватает: 1.6.4 однопоточный, второй нужен только сборщику мусора.
    # Лимит памяти держите выше JAVA_XMX — JVM берёт сверх кучи на метаданные и стеки.
    deploy:
      resources:
        limits:
          memory: 5G

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  auth:
    build:
      context: ./auth
    image: mc164-auth:0.1
    container_name: mc164-auth
    restart: unless-stopped

    ports:
      - "8080:8080"

    volumes:
      # База аккаунтов и скины
      - authdata:/data
      # Раздача клиента для лаунчера: её готовит tools/build_dist.py из зеркала.
      # Каталог только читается, и в образ он не входит — это 119 МБ данных,
      # которым нечего делать в релизе.
      - ./dist:/data/dist:ro

    environment:
      # Основной админский аккаунт. Пароль по умолчанию совпадает с ником —
      # задайте здесь свой до того, как сервис станет доступен извне.
      OW_ADMIN_USER: "flower"
      # OW_ADMIN_PASSWORD: "..."
      TZ: "Europe/Moscow"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mcdata:
  authdata:
